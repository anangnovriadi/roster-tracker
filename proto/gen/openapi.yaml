                DeleteSpaceMember removes a member. A space administrator can remove any
                 member, and a member may delete their own membership to leave the space.
                 A space must keep at least one administrator.
            operationId: SpaceService_DeleteSpaceMember
            parameters:
                - name: space
                  in: path
                  description: The space id.
                  required: true
                  schema:
                    type: string
                - name: member
                  in: path
                  description: The member id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - SpaceService
            description: |-
                UpdateSpaceMember changes a member's space role. Only a space administrator
                 can change roles, and a space must keep at least one administrator.
            operationId: SpaceService_UpdateSpaceMember
            parameters:
                - name: space
                  in: path
                  description: The space id.
                  required: true
                  schema:
                    type: string
                - name: member
                  in: path
                  description: The member id.
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  description: |-
                    Required. The fields to update. Must include role. The user path is also
                     accepted, but the user must match the existing member and is never changed.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SpaceMember'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SpaceMember'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/usageLimits:
        get:
            tags:
                - InstanceService
            description: |-
                ListUsageLimits lists the usage limits: the defaults for every user and the
                 limits for single users. Admin only.
            operationId: InstanceService_ListUsageLimits
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. The maximum number of usage limits to return. If unspecified, at
                     most 50 are returned. The maximum value is 1000; values above 1000 are
                     coerced to 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Optional. A page token from a previous call. Provide it to retrieve the
                     next page.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. A CEL filter on `user` and `metric`, combined with `&&`.
                     `user == ""` selects the defaults for every user.
                     Example: "user == 'users/steven' && metric == 'STORAGE_BYTES'"
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListUsageLimitsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - InstanceService
            description: |-
                CreateUsageLimit creates a usage limit. Admin only. There is at most one
                 limit per metric and user, and one default per metric. Fails with
                 FAILED_PRECONDITION when the usage limits are configured by the deployment.
            operationId: InstanceService_CreateUsageLimit
            parameters:
                - name: usageLimitId
                  in: query
                  description: |-
                    Optional. The ID to use for the usage limit, which becomes the final
                     segment of its name. Lowercase letters, digits and hyphens, at most 32
                     characters, starting with a letter. Generated when empty.
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UsageLimit'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsageLimit'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/usageLimits/{usageLimit}:
        get:
            tags:
                - InstanceService
            description: GetUsageLimit gets a usage limit. Admin only.
            operationId: InstanceService_GetUsageLimit
            parameters:
                - name: usageLimit
                  in: path
                  description: The usageLimit id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsageLimit'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - InstanceService
            description: |-
                DeleteUsageLimit deletes a usage limit. Admin only. Deleting a user's limit
                 returns the user to the default; deleting a default makes the metric
                 unlimited for users without their own limit.
            operationId: InstanceService_DeleteUsageLimit
            parameters:
                - name: usageLimit
                  in: path
                  description: The usageLimit id.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - InstanceService
            description: |-
                UpdateUsageLimit updates the value of a usage limit. Admin only. The metric
                 and user cannot change.
            operationId: InstanceService_UpdateUsageLimit
            parameters:
                - name: usageLimit
                  in: path
                  description: The usageLimit id.
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  description: |-
                    Optional. The fields to update. Only `value` is supported, which is also
                     the default.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UsageLimit'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsageLimit'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/users:
        get:
            tags:
                - UserService
            description: ListUsers lists users in every state. Only admins may call it.
            operationId: UserService_ListUsers
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. The maximum number of users to return. The service may return
                     fewer. If unspecified, at most 50 users are returned. The maximum value is
                     1000; values above 1000 are coerced to 1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Optional. A page token from a previous call. Provide it to retrieve the
                     next page.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. A CEL filter on the users. Only `username == '<username>'` is
                     supported.
                     Example: "username == 'steven'"
                  schema:
                    type: string
                - name: showDeleted
                  in: query
                  description: Optional. Currently ignored; the list includes users in every state.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListUsersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - UserService
            description: |-
                CreateUser creates a user. The first user of an instance becomes an admin.
                 Otherwise, unless an admin calls it, the instance must allow user
                 registration and password sign-up, and the new user gets the USER role.
            operationId: UserService_CreateUser
            parameters:
                - name: userId
                  in: query
                  description: |-
                    Optional. The resource ID to use for this user. If set, it must equal
                     user.username and follow the username format.
                     Format: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,34}[a-zA-Z0-9])?$
                  schema:
                    type: string
                - name: validateOnly
                  in: query
                  description: Optional. If set, validate the request but do not create the user.
                  schema:
                    type: boolean
                - name: requestId
                  in: query
                  description: Optional. An idempotency token. Currently ignored.
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/User'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /api/users/{user}:
        get:
            tags:
                - UserService
            description: GetUser gets a user by resource name.
            operationId: UserService_GetUser
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
                - name: readMask
                  in: query
                  description: Optional. Currently ignored; all fields are returned.
                  schema:
                    type: string
                    format: field-mask
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - UserService
            description: |-
                DeleteUser deletes a user. Users may delete themselves; admins may delete
                 anyone. A user who belongs to any space cannot be deleted.
            operationId: UserService_DeleteUser
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
                - name: force
                  in: query
                  description: |-
                    Optional. Currently ignored; deleting a user who belongs to any space
                     fails with FAILED_PRECONDITION.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content: {}
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        patch:
            tags:
                - UserService
            description: |-
                UpdateUser updates a user. Users may update themselves; admins may update
                 anyone. Changing the password ends the user's other sessions.
            operationId: UserService_UpdateUser
            parameters:
                - name: user
                  in: path
                  description: The user id.
                  required: true
                  schema:
                    type: string
                - name: updateMask
                  in: query
                  description: |-
                    Required. The fields to update. Supported paths: username, display_name,
                     email, avatar_url, description, password, role, state. role and state
                     require an admin.
                  schema:
                    type: string
                    format: field-mask
                - name: allowMissing
                  in: query
                  description: Optional. Currently ignored; updating a missing user fails with NOT_FOUND.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/User'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
