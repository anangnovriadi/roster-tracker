            properties:
                width:
                    type: integer
                    description: Display-oriented width in pixels. Must be provided with height.
                    format: int32
                height:
                    type: integer
                    description: Display-oriented height in pixels. Must be provided with width.
                    format: int32
                photo:
                    allOf:
                        - $ref: '#/components/schemas/PhotoMetadata'
                    description: Photo metadata, for image attachments.
                video:
                    allOf:
                        - $ref: '#/components/schemas/VideoMetadata'
                    description: Video metadata, for video attachments.
            description: |-
                MediaMetadata contains normalized metadata explicitly supplied by a client.
                 The service validates and stores this data but does not extract it from the media file.
        MotionMedia:
            type: object
            properties:
                family:
                    enum:
                        - MOTION_MEDIA_FAMILY_UNSPECIFIED
                        - APPLE_LIVE_PHOTO
                        - ANDROID_MOTION_PHOTO
                    type: string
                    description: The motion photo format.
                    format: enum
                role:
                    enum:
                        - MOTION_MEDIA_ROLE_UNSPECIFIED
                        - STILL
                        - VIDEO
                        - CONTAINER
                    type: string
                    description: The part this attachment plays in the motion photo.
                    format: enum
                groupId:
                    type: string
                    description: |-
                        Groups the attachments that belong to one motion photo. Required for client-supplied Apple Live Photo metadata;
                         for an Android motion photo it is the attachment's own ID.
                presentationTimestampUs:
                    type: string
                    description: Presentation timestamp of the still frame within the video, in microseconds.
                hasEmbeddedVideo:
                    type: boolean
                    description: Whether the file embeds the motion video, as in an Android motion photo container.
            description: MotionMedia links the parts of a motion photo.
        Note:
            required:
                - content
                - visibility
                - state
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the note, where note is the
                         user-defined UID.
                         Format: notes/{note}
                creator:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. The resource name of the creator.
                         Format: users/{user}
                space:
                    type: string
                    description: |-
                        Optional. The space in which the note is placed. Every note, including a
                         comment, owns its placement independently.
                         Format: spaces/{space}
                content:
                    type: string
                    description: |-
                        Required. The content of the note in Markdown. Must not exceed the
                         instance's content length limit.
                location:
                    allOf:
                        - $ref: '#/components/schemas/Location'
                    description: Optional. The location of the note.
                visibility:
                    enum:
                        - VISIBILITY_UNSPECIFIED
                        - PRIVATE
                        - PROTECTED
                        - PUBLIC
                        - SPACE
                    type: string
                    description: |-
                        Required. The visibility of the note. Defaults to PRIVATE on creation when
                         unspecified. SPACE requires the note to be placed in a space.
                    format: enum
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - NORMAL
                        - ARCHIVED
                    type: string
                    description: |-
                        Required. The state of the note. New notes are always NORMAL; change it
                         with UpdateNote.
                    format: enum
                pinned:
                    type: boolean
                    description: |-
                        Optional. Whether the note is pinned. Ignored on creation; change it with
                         UpdateNote.
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                    description: Optional. The attachments of the note. Setting it replaces the full set.
                relations:
                    type: array
                    items:
                        $ref: '#/components/schemas/NoteRelation'
                    description: |-
                        Optional. The relations of the note in both directions. Only REFERENCE
                         relations can be set; COMMENT relations are output only.
                reactions:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/Reaction'
                    description: Output only. The reactions to the note.
                parent:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. The context note of this COMMENT relation, if any.
                         Its identity is returned even when the caller cannot read the parent.
                         Fetch the parent independently; this field does not grant read access.
                         Format: notes/{note}
                tags:
                    readOnly: true
                    type: array
                    items:
                        type: string
                    description: Output only. The tags extracted from the content.
                property:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/Note_Property'
                    description: Output only. The properties computed from the content.
                snippet:
                    readOnly: true
                    type: string
                    description: Output only. A plain-text snippet of the content.
                createTime:
                    type: string
                    description: |-
                        Optional. The creation time. Defaults to the current time when unset on
                         creation.
                    format: date-time
                updateTime:
                    type: string
                    description: |-
                        Optional. The last update time. Defaults to the current time when unset on
                         creation.
                    format: date-time
            description: Note is a Markdown note written by a user.
        NoteRelation:
            required:
                - note
                - relatedNote
                - type
            type: object
            properties:
                note:
                    allOf:
                        - $ref: '#/components/schemas/NoteRelation_NoteRef'
                    description: Required. The source note of the relation. For COMMENT, the comment.
                relatedNote:
                    allOf:
                        - $ref: '#/components/schemas/NoteRelation_NoteRef'
                    description: |-
                        Required. The target note of the relation. For COMMENT, the note being
                         commented on.
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - REFERENCE
                        - COMMENT
                    type: string
                    description: Required. The type of the relation.
                    format: enum
            description: NoteRelation is a directed link from one note to another.
        NoteRelation_NoteRef:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the note.
                         Format: notes/{note}
                snippet:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. A plain-text snippet of the note content. Empty in
                         ListNotes and ListNoteComments responses.
            description: NoteRef identifies a note in a relation.
        NoteShare:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the share. The {share} segment is the
                         opaque token used in the share URL.
                         Format: notes/{note}/shares/{share}
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation time.
                    format: date-time
                expireTime:
                    type: string
                    description: |-
                        Optional. The time after which the share link stops working. Must be in
                         the future when set. If unset, the link never expires.
                    format: date-time
            description: |-
                NoteShare is an access grant that permits read-only access to a note via an
                 opaque bearer token.
        NoteView:
            required:
                - title
                - filter
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the note view.
                         Format: users/{user}/views/{view}
                title:
                    type: string
                    description: Required. The title of the note view.
                filter:
                    type: string
                    description: |-
                        Required. The CEL filter expression for the note view, using the same
                         grammar as the ListNotes `filter` argument. Reuse it by passing this value
                         to ListNotes.
                icon:
                    allOf:
                        - $ref: '#/components/schemas/NoteView_Icon'
                    description: |-
                        Optional. Display icon. Omit when updating with the "icon" mask to reset to
                         the default view icon.
            description: NoteView is a user's saved note filter.
        NoteView_Icon:
            type: object
            properties:
                emoji:
                    type: string
                    description: A Unicode emoji sequence.
                lucide:
                    type: string
                    description: A canonical Lucide icon name, such as "leaf".
        Note_Property:
            type: object
            properties:
                title:
                    type: string
                    description: The text of the H1 heading when it is the first block of the content.
                hasLink:
                    type: boolean
                    description: Whether the content contains a link.
                hasCode:
                    type: boolean
                    description: Whether the content contains inline code or a code block.
                hasTaskList:
                    type: boolean
                    description: Whether the content contains a task list.
                hasIncompleteTasks:
                    type: boolean
                    description: Whether the content contains an unchecked task.
            description: Property holds properties computed from the note content.
        NotificationSetting_EmailSetting:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: Whether email notifications are enabled.
                smtpHost:
                    type: string
                    description: The SMTP server host.
                smtpPort:
                    type: integer
                    description: The SMTP server port.
                    format: int32
                smtpUsername:
                    type: string
                    description: The SMTP username.
                smtpPassword:
                    writeOnly: true
                    type: string
                    description: |-
                        Input only. The SMTP password. Never returned. An empty value keeps the stored password, unless the host,
                         port, username or encryption settings change.
                useTls:
                    type: boolean
                    description: Whether to use STARTTLS.
                useSsl:
                    type: boolean
                    description: Whether to use implicit SSL/TLS.
                fromEmail:
                    type: string
                    description: The sender email address.
                fromName:
                    type: string
                    description: The sender display name.
                replyTo:
                    type: string
                    description: The Reply-To email address.
            description: EmailSetting is the SMTP configuration for notification emails.
        OAuth2Config:
            type: object
            properties:
                clientId:
                    type: string
                    description: The OAuth2 client ID.
                clientSecret:
                    type: string
                    description: 'The OAuth2 client secret. Write-only: it is never returned in responses.'
                authUrl:
                    type: string
                    description: The authorization endpoint URL.
                tokenUrl:
                    type: string
                    description: The token endpoint URL, used to exchange the authorization code for an access token.
                userInfoUrl:
                    type: string
                    description: The user info endpoint URL, used to fetch the claims of the signed-in user.
                scopes:
                    type: array
                    items:
                        type: string
                    description: The scopes to request.
                fieldMapping:
                    allOf:
                        - $ref: '#/components/schemas/FieldMapping'
                    description: How user info claims map to user fields.
            description: OAuth2Config is the configuration of an OAuth2 identity provider.
        PersonalAccessToken:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the personal access token.
                         Format: users/{user}/personalAccessTokens/{personal_access_token}
                description:
                    type: string
                    description: Optional. The description of the token.
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation time.
                    format: date-time
                expireTime:
                    type: string
                    description: Optional. The expiration time. Unset means the token never expires.
                    format: date-time
                lastUseTime:
                    readOnly: true
                    type: string
                    description: Output only. The time the token was last used.
                    format: date-time
            description: |-
                PersonalAccessToken is a long-lived token for API and script access.
                 PATs are distinct from short-lived JWT access tokens used for session
                 authentication.
        PhotoMetadata:
            type: object
            properties:
                captureTime:
                    allOf:
                        - $ref: '#/components/schemas/MediaCaptureTime'
                    description: Capture time as recorded by the source media.
                location:
                    allOf:
                        - $ref: '#/components/schemas/MediaLocation'
                    description: Geographic location recorded by the source media.
                sourceExifOrientation:
                    type: integer
                    description: |-
                        EXIF orientation value from 1 through 8 as recorded by the source file.
                         This value is informational and must not be reapplied to the stored attachment;
                         width and height already describe its display-oriented dimensions.
                    format: int32
                cameraMake:
                    type: string
                    description: The camera manufacturer.
                cameraModel:
                    type: string
                    description: The camera model.
                lensModel:
                    type: string
                    description: The lens model.
                fNumber:
                    type: number
                    description: The aperture f-number.
                    format: double
                exposureTimeSeconds:
                    type: number
                    description: The exposure time in seconds.
                    format: double
                iso:
                    type: integer
                    description: The ISO sensitivity.
                    format: int32
                focalLengthMm:
                    type: number
                    description: The focal length in millimeters.
                    format: double
            description: PhotoMetadata is metadata recorded by the source of a photo.
        Reaction:
            required:
                - reactionType
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        Identifier. The resource name of the reaction.
                         Format: notes/{note}/reactions/{reaction}
                creator:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. The resource name of the creator.
                         Format: users/{user}
                reactionType:
                    type: string
                    description: "Required. The reaction, such as an emoji (\"\U0001F44D\", \"❤️\", \"\U0001F604\")."
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation time.
                    format: date-time
            description: Reaction is a reaction a user leaves on a note.
        RefreshTokenRequest:
            type: object
            properties: {}
            description: |-
                Request message for AuthService.RefreshToken.
                 It has no fields: the refresh token is read from the HttpOnly cookie.
        RefreshTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: The new short-lived access token.
                accessTokenExpireTime:
                    type: string
                    description: When the new access token expires.
                    format: date-time
            description: Response message for AuthService.RefreshToken.
        RosterAssignment:
            required:
                - date
                - user
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the assignment.
                         Format: roster-assignments/{roster_assignment}
                date:
                    type: string
                    description: |-
                        Required. The day on duty.
                         Format: YYYY-MM-DD
                user:
                    type: string
                    description: |-
                        Required. The member on duty.
                         Format: users/{user}
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
            description: RosterAssignment puts one member on duty for one day.
        SetNoteAttachmentsRequest:
            required:
                - name
                - attachments
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the note.
                         Format: notes/{note}
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                    description: Required. The complete set of attachments for the note.
            description: Request message for NoteService.SetNoteAttachments.
        SetNoteRelationsRequest:
            required:
                - name
                - relations
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The resource name of the note.
                         Format: notes/{note}
                relations:
                    type: array
                    items:
                        $ref: '#/components/schemas/NoteRelation'
                    description: |-
                        Required. The complete set of REFERENCE relations for the note. COMMENT
                         relations are rejected.
            description: Request message for NoteService.SetNoteRelations.
        SignInRequest:
            type: object
            properties:
                passwordCredentials:
                    allOf:
                        - $ref: '#/components/schemas/SignInRequest_PasswordCredentials'
                    description: Username and password credentials.
                ssoCredentials:
                    allOf:
                        - $ref: '#/components/schemas/SignInRequest_SsoCredentials'
                    description: SSO credentials from an OAuth2 authorization code flow.
            description: Request message for AuthService.SignIn.
        SignInRequest_PasswordCredentials:
            required:
                - username
                - password
            type: object
            properties:
                username:
                    type: string
                    description: Required. The username or email address to sign in with.
                password:
                    type: string
                    description: Required. The password to sign in with.
            description: |-
                PasswordCredentials are a username and password.
                 Regular users cannot use them when the instance disallows password sign-in.
        SignInRequest_SsoCredentials:
            required:
                - identityProvider
                - code
                - redirectUri
            type: object
            properties:
                identityProvider:
                    type: string
                    description: |-
                        Required. The resource name of the identity provider.
                         Format: identity-providers/{idp}
                code:
                    type: string
                    description: Required. The authorization code returned by the identity provider.
                redirectUri:
                    type: string
                    description: Required. The redirect URI used in the authorization request.
                codeVerifier:
                    type: string
                    description: Optional. The PKCE code verifier (RFC 7636). Set it when the authorization request used a code challenge.
            description: |-
                SsoCredentials are the result of an OAuth2 authorization code flow with an identity provider.
                 A first sign-in creates a local user unless the instance disallows user registration.
        SignInResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The signed-in user.
                accessToken:
                    type: string
                    description: |-
                        The short-lived access token for API requests.
                         Keep it in memory only, not in localStorage.
                accessTokenExpireTime:
                    type: string
                    description: |-
                        When the access token expires.
                         Call RefreshToken before this time.
                    format: date-time
            description: Response message for AuthService.SignIn.
        Space:
            required:
                - title
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the space.
                         Format: spaces/{space}
                title:
                    type: string
                    description: Required. The human-readable title.
                description:
                    type: string
                    description: Optional. A description of the space.
                icon:
                    allOf:
                        - $ref: '#/components/schemas/Space_Icon'
                    description: |-
                        Optional. The display icon. Omit it when updating with the "icon" mask to
                         reset to the default space mark.
                currentUserRole:
                    readOnly: true
                    enum:
                        - ROLE_UNSPECIFIED
                        - ADMIN
                        - USER
                    type: string
                    description: |-
                        Output only. The authenticated user's membership role in this space.
                         ROLE_UNSPECIFIED when this space is exposed as metadata only.
                    format: enum
                memberCount:
                    readOnly: true
                    type: integer
                    description: |-
                        Output only. The number of accepted members in this space. Pending
                         invitations are excluded. Zero when this space is exposed as metadata only.
                    format: int32
            description: Space is a collaboration boundary for placed notes.
        SpaceInvitation:
            required:
                - invitee
                - role
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the invitation. The invitation segment
                         is the invitee's username.
                         Format: spaces/{space}/invitations/{invitation}
                invitee:
                    type: string
                    description: |-
                        Required. The invited user.
                         Format: users/{user}
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ADMIN
                        - USER
                    type: string
                    description: Required. The role the user receives after accepting the invitation.
                    format: enum
                space:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/Space'
                    description: |-
                        Output only. The space the user is invited to, as metadata only. This lets
                         an invitee understand the invitation without membership-based GetSpace
                         access.
            description: SpaceInvitation is a pending invitation for an existing user to join a space.
        SpaceMember:
            required:
                - user
                - role
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the membership. The member segment is
                         the member's username.
                         Format: spaces/{space}/members/{member}
                user:
                    type: string
                    description: |-
                        Required. The member user.
                         Format: users/{user}
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ADMIN
                        - USER
                    type: string
                    description: Required. The member's role within this space.
                    format: enum
            description: SpaceMember is a user's membership and governance role in a space.
        Space_Icon:
            type: object
            properties:
                emoji:
                    type: string
                    description: A Unicode emoji sequence.
                lucide:
                    type: string
                    description: A canonical Lucide icon name, such as "leaf".
            description: Icon is the display icon of a space.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StorageSetting_S3Config:
            type: object
            properties:
                endpoint:
                    type: string
                    description: The S3 endpoint URL.
                region:
                    type: string
                    description: The S3 region.
                bucket:
                    type: string
                    description: The S3 bucket.
                accessKeyId:
                    type: string
                    description: The S3 access key ID.
                accessKeySecret:
                    writeOnly: true
                    type: string
                    description: Input only. The S3 access key secret. Never returned; an empty value keeps the stored secret.
                usePathStyle:
                    type: boolean
                    description: Whether to use path-style addressing instead of virtual-hosted-style.
                insecureSkipTlsVerify:
                    type: boolean
                    description: |-
                        Whether to skip TLS certificate verification when connecting to the S3 endpoint.
                         Only enable this for trusted endpoints that use a self-signed certificate; it removes protection against
                         man-in-the-middle attacks.
            description: |-
                S3Config is the legacy S3 configuration, retained for compatibility with existing clients.
                 Reference: https://developers.cloudflare.com/r2/examples/aws/aws-sdk-go/
        Storage_S3Config:
            type: object
            properties:
                endpoint:
                    type: string
                    description: The S3 endpoint URL.
                region:
                    type: string
                    description: The S3 region.
                bucket:
                    type: string
                    description: The S3 bucket.
                accessKeyId:
                    type: string
                    description: The S3 access key ID.
                accessKeySecret:
                    writeOnly: true
                    type: string
                    description: Input only. The S3 access key secret. Never returned; an empty value keeps the stored secret.
                usePathStyle:
                    type: boolean
                    description: Whether to use path-style addressing instead of virtual-hosted-style.
                insecureSkipTlsVerify:
                    type: boolean
                    description: |-
                        Whether to skip TLS certificate verification when connecting to the S3 endpoint.
                         Only enable this for trusted endpoints that use a self-signed certificate; it removes protection against
                         man-in-the-middle attacks.
            description: |-
                S3Config is the configuration of an S3-compatible object store.
                 Reference: https://developers.cloudflare.com/r2/examples/aws/aws-sdk-go/
        TestInstanceEmailSettingRequest:
            type: object
            properties:
                email:
                    allOf:
                        - $ref: '#/components/schemas/NotificationSetting_EmailSetting'
                    description: |-
                        Optional. The SMTP settings to test. If omitted, the stored notification email setting is used. An empty
                         password reuses the stored password when the connection settings are unchanged.
                recipientEmail:
                    type: string
                    description: Optional. The recipient email address. If omitted, the current user's email address is used.
            description: Request message for InstanceService.TestInstanceEmailSetting.
        TranscribeRequest:
            required:
                - audio
            type: object
            properties:
                audio:
                    allOf:
                        - $ref: '#/components/schemas/TranscriptionAudio'
                    description: Required. The audio to transcribe.
            description: Request message for AIService.Transcribe.
        TranscribeResponse:
            type: object
            properties:
                text:
                    type: string
                    description: The transcribed text.
            description: Response message for AIService.Transcribe.
        TranscriptionAudio:
            type: object
            properties:
                content:
                    writeOnly: true
                    type: string
                    description: Input only. Inline audio bytes, at most 25 MiB.
                    format: bytes
                uri:
                    type: string
                    description: URI of the audio content. Reserved for future use; the service rejects requests that set it.
                filename:
                    type: string
                    description: Optional. The uploaded filename, at most 255 characters.
                contentType:
                    type: string
                    description: Optional. The MIME type of the audio. If empty, the service detects it from the content.
            description: TranscriptionAudio is the audio input for a transcription.
        UploadAttachmentRequest:
            required:
                - writeOffset
            type: object
            properties:
                spec:
                    allOf:
                        - $ref: '#/components/schemas/UploadAttachmentSpec'
                    description: Starts a new upload. The same call may also carry data and finish_write.
                uploadId:
                    type: string
                    description: Continues the upload identified by a previous response.
                writeOffset:
                    type: string
                    description: |-
                        Required. Zero-based byte offset at which data is written. Must equal the committed size, except when retrying
                         the most recently accepted chunk with identical bytes and offset, which is accepted without writing again.
                data:
                    type: string
                    description: |-
                        Optional. File bytes, at most max_chunk_size long. With no data and finish_write false, the call reports
                         progress without writing, and write_offset is ignored.
                    format: bytes
                finishWrite:
                    type: boolean
                    description: |-
                        Optional. Finalize the upload after writing data. The committed size must then equal total_size. Any later call
                         for the same upload_id returns the created attachment.
            description: Request message for AttachmentService.UploadAttachment.
        UploadAttachmentResponse:
            type: object
            properties:
                uploadId:
                    type: string
                    description: Opaque ID for subsequent calls. This is not a resource name.
                committedSize:
                    type: string
                    description: Number of file bytes committed so far.
                maxChunkSize:
                    type: integer
                    description: Maximum number of data bytes accepted in one call.
                    format: int32
                attachment:
                    allOf:
                        - $ref: '#/components/schemas/Attachment'
                    description: The created attachment. Set once the upload has been finalized.
            description: Response message for AttachmentService.UploadAttachment.
        UploadAttachmentSpec:
            required:
                - attachment
            type: object
            properties:
                attachment:
                    allOf:
                        - $ref: '#/components/schemas/Attachment'
                    description: Required. Metadata for the attachment to create. content must be empty; file bytes are sent in data.
                attachmentId:
                    type: string
                    description: |-
                        Optional. The ID to use for the attachment. If empty, a unique ID is generated.
                         Format: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,34}[a-zA-Z0-9])?$
                totalSize:
                    type: string
                    description: Optional. Total size of the file in bytes before media processing. Zero represents an empty file.
            description: UploadAttachmentSpec describes the attachment that a new upload creates.
        UpsertNoteReactionRequest:
            required:
                - parent
                - reaction
            type: object
            properties:
                parent:
                    type: string
                    description: |-
                        Required. The resource name of the note.
                         Format: notes/{note}
                reaction:
                    allOf:
                        - $ref: '#/components/schemas/Reaction'
                    description: Required. The reaction to upsert. Only reaction_type is used.
            description: Request message for NoteService.UpsertNoteReaction.
        UsageLimit:
            required:
                - metric
                - value
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the usage limit.
                         Format: usageLimits/{usage_limit}
                metric:
                    enum:
                        - METRIC_UNSPECIFIED
                        - NOTES
                        - STORAGE_BYTES
                        - UPLOAD_BYTES
                    type: string
                    description: Required. Immutable. What is limited.
                    format: enum
                user:
                    type: string
                    description: |-
                        Optional. Immutable. The user the limit applies to. Empty means every user.
                         Format: users/{user}
                value:
                    type: string
                    description: Required. The limit. Must not be negative. 0 means unlimited.
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation time.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: Output only. The last update time.
                    format: date-time
            description: |-
                UsageLimit sets one limit for every user, or for one user. When both exist
                 for the same metric, the limit for the user applies to that user.
        User:
            required:
                - username
                - role
                - state
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the user. {user} is the username.
                         Format: users/{user}
                username:
                    type: string
                    description: Required. The unique username, used to sign in.
                displayName:
                    type: string
                    description: Optional. The display name of the user.
                email:
                    type: string
                    description: |-
                        Optional. The email address of the user. Stored trimmed and lowercased;
                         empty means no address. An address belongs to at most one user on the
                         instance, so writes that would reuse one fail with ALREADY_EXISTS.
                         Returned only to the user and to admins.
                avatarUrl:
                    type: string
                    description: |-
                        Optional. The avatar URL of the user. An avatar set as a data URI (PNG,
                         JPEG, GIF or WebP, at most 2 MiB) is returned as a file server URL.
                description:
                    type: string
                    description: Optional. The description of the user.
                password:
                    writeOnly: true
                    type: string
                    description: Input only. The password of the user. Never returned.
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ADMIN
                        - USER
                    type: string
                    description: Required. The role of the user. Only admins can change it.
                    format: enum
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - NORMAL
                        - ARCHIVED
                    type: string
                    description: Required. The state of the user. Only admins can change it.
                    format: enum
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: Output only. The last update timestamp.
                    format: date-time
            description: User is an account on the instance.
        UserNotification:
            type: object
            properties:
                name:
                    readOnly: true
                    type: string
                    description: |-
                        Identifier. The resource name of the notification.
                         Format: users/{user}/notifications/{notification}
                sender:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. The user who caused the notification.
                         Format: users/{user}
                senderUser:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: Output only. The sender user details.
                type:
                    readOnly: true
                    enum:
                        - TYPE_UNSPECIFIED
                        - NOTE_COMMENT
                        - NOTE_MENTION
                        - SPACE_INVITATION
                    type: string
                    description: Output only. The type of the notification.
                    format: enum
                noteComment:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/UserNotification_NoteCommentPayload'
                    description: Output only. Details of a NOTE_COMMENT notification.
                noteMention:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/UserNotification_NoteMentionPayload'
                    description: Output only. Details of a NOTE_MENTION notification.
                spaceInvitation:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/UserNotification_SpaceInvitationPayload'
                    description: Output only. Details of a SPACE_INVITATION notification.
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - UNREAD
                        - ARCHIVED
                    type: string
                    description: Optional. The status of the notification.
                    format: enum
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp.
                    format: date-time
            description: UserNotification is a notification delivered to a user.
        UserNotification_NoteCommentPayload:
            type: object
            properties:
                note:
                    type: string
                    description: |-
                        The comment note.
                         Format: notes/{note}
                relatedNote:
                    type: string
                    description: |-
                        The note that was commented on.
                         Format: notes/{note}
                noteSnippet:
                    type: string
                    description: Preview text of the comment note.
                relatedNoteSnippet:
                    type: string
                    description: Preview text of the related note.
            description: NoteCommentPayload holds the details of a NOTE_COMMENT notification.
        UserNotification_NoteMentionPayload:
            type: object
            properties:
                note:
                    type: string
                    description: |-
                        The note that contains the mention.
                         Format: notes/{note}
                relatedNote:
                    type: string
                    description: |-
                        The related parent note when the mention was created in a comment.
                         Format: notes/{note}
                noteSnippet:
                    type: string
                    description: Preview text of the note that contains the mention.
                relatedNoteSnippet:
                    type: string
                    description: Preview text of the related parent note.
            description: NoteMentionPayload holds the details of a NOTE_MENTION notification.
        UserNotification_SpaceInvitationPayload:
            type: object
            properties:
                spaceInvitation:
                    type: string
                    description: |-
                        The invitation.
                         Format: spaces/{space}/invitations/{invitation}
                space:
                    allOf:
                        - $ref: '#/components/schemas/Space'
                    description: The read-only Space summary carried by the invitation.
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ADMIN
                        - USER
                    type: string
                    description: The role the invitation offers.
                    format: enum
                state:
                    enum:
                        - STATE_UNSPECIFIED
                        - PENDING
                        - ACCEPTED
                    type: string
                    description: The current state of the invitation for the receiver.
                    format: enum
            description: |-
                SpaceInvitationPayload holds the details of a SPACE_INVITATION
                 notification.
        UserSetting:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the user setting. {setting} is the
                         setting key, such as GENERAL.
                         Format: users/{user}/settings/{setting}
                generalSetting:
                    allOf:
                        - $ref: '#/components/schemas/UserSetting_GeneralSetting'
                    description: The value of the GENERAL setting.
                webhooksSetting:
                    allOf:
                        - $ref: '#/components/schemas/UserSetting_WebhooksSetting'
                    description: The value of the WEBHOOKS setting.
                tagsSetting:
                    allOf:
                        - $ref: '#/components/schemas/UserSetting_TagsSetting'
                    description: The value of the TAGS setting.
            description: UserSetting is one group of a user's preferences, identified by its key.
        UserSetting_GeneralSetting:
            type: object
            properties:
                locale:
                    type: string
                    description: Optional. The preferred locale of the user.
                noteVisibility:
                    type: string
                    description: |-
                        Optional. The default visibility of new notes: PRIVATE, PROTECTED or
                         PUBLIC.
                theme:
                    type: string
                    description: |-
                        Optional. The preferred theme of the user. This references a CSS file in
                         the web/public/themes/ directory. If not set, the default theme is used.
                saveMediaMetadata:
                    type: boolean
                    description: |-
                        Optional. Whether the official client should save metadata from future
                         media uploads.
            description: GeneralSetting holds general user preferences.
        UserSetting_TagMetadata:
            type: object
            properties:
                backgroundColor:
                    allOf:
                        - $ref: '#/components/schemas/Color'
                    description: |-
                        Optional. The background color of the tag label. When unset, the default
                         tag color is used.
                blurContent:
                    type: boolean
                    description: Optional. Whether notes with this tag have their content blurred.
            description: TagMetadata holds user-specific display rules for a tag.
        UserSetting_TagsSetting:
            type: object
            properties:
                tags:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/UserSetting_TagMetadata'
                    description: |-
                        Optional. Map of tag name pattern to tag metadata. Each key is treated as
                         an anchored regular expression (^pattern$).
            description: TagsSetting holds user-specific tag metadata.
        UserSetting_WebhooksSetting:
            type: object
            properties:
                webhooks:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserWebhook'
                    description: The user's webhooks.
            description: WebhooksSetting holds a user's webhooks.
        UserStats:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the user statistics singleton.
                         Format: users/{user}/stats
                totalNoteCount:
                    type: integer
                    description: The number of counted notes.
                    format: int32
                noteTypeStats:
                    allOf:
                        - $ref: '#/components/schemas/UserStats_NoteTypeStats'
                    description: The number of counted notes by content type.
                tagCounts:
                    type: object
                    additionalProperties:
                        type: integer
                        format: int32
                    description: The number of counted notes per tag.
                pinnedNotes:
                    type: array
                    items:
                        type: string
                    description: |-
                        The pinned notes among the counted notes.
                         Format: notes/{note}
                noteCreatedTimestamps:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: The creation timestamps of the counted notes, one per note.
                noteUpdatedTimestamps:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: |-
                        The latest update timestamps of the counted notes (one per note, mirrors
                         note_created_timestamps). Used by the activity heatmap when the client's
                         view is set to update_time basis.
                attachmentStorageBytes:
                    readOnly: true
                    type: string
                    description: |-
                        Output only. Total persisted attachment size in bytes, including unlinked
                         uploads and attachments in all spaces. Excludes temporary uploads and
                         derived files. Returned only by GetUserStats for the authenticated user's
                         own stats, independently of the request's note filter.
            description: UserStats is a summary of a user's notes. Comments are not counted.
        UserStats_NoteTypeStats:
            type: object
            properties:
                linkCount:
                    type: integer
                    description: The number of notes that contain a link.
                    format: int32
                codeCount:
                    type: integer
                    description: The number of notes that contain code.
                    format: int32
                todoCount:
                    type: integer
                    description: The number of notes that contain a task list.
                    format: int32
                undoCount:
                    type: integer
                    description: The number of notes that contain incomplete tasks.
                    format: int32
            description: NoteTypeStats counts notes by the kind of content they contain.
        UserUsage:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the user usage singleton.
                         Format: users/{user}/usage
                noteCount:
                    type: string
                    description: |-
                        The number of notes the user created, including comments, archived
                         notes, and notes in Spaces.
                storageBytes:
                    type: string
                    description: |-
                        The total size in bytes of the user's uploads, including uploads not
                         attached to a note. External links do not count.
                notesLimit:
                    allOf:
                        - $ref: '#/components/schemas/UserUsage_EffectiveLimit'
                    description: The limit on note_count.
                storageBytesLimit:
                    allOf:
                        - $ref: '#/components/schemas/UserUsage_EffectiveLimit'
                    description: The limit on storage_bytes.
                uploadBytesLimit:
                    allOf:
                        - $ref: '#/components/schemas/UserUsage_EffectiveLimit'
                    description: The limit on the size of one uploaded file.
            description: UserUsage is a user's usage and the usage limits in effect for the user.
        UserUsage_EffectiveLimit:
            type: object
            properties:
                value:
                    type: string
                    description: The limit. 0 means unlimited.
                usageLimit:
                    type: string
                    description: |-
                        The usage limit the value comes from: the user's own limit, or else the
                         default. Empty when no usage limit applies.
                         Format: usageLimits/{usage_limit}
            description: |-
                EffectiveLimit is the limit in effect for one metric, and where it comes
                 from.
        UserWebhook:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the webhook.
                         Format: users/{user}/webhooks/{webhook}
                displayName:
                    type: string
                    description: A human-readable name for the webhook.
                url:
                    type: string
                    description: The URL the webhook request is sent to. Required on create.
                signingSecret:
                    writeOnly: true
                    type: string
                    description: |-
                        Input only. The secret used to HMAC-SHA256 sign the webhook request body.
                         Never returned; use GetUserWebhookSigningSecret to read it.
                signingSecretSet:
                    readOnly: true
                    type: boolean
                    description: Output only. Whether a signing secret is configured for this webhook.
                createTime:
                    readOnly: true
                    type: string
                    description: Output only. The creation timestamp. Currently never set.
                    format: date-time
                updateTime:
                    readOnly: true
                    type: string
                    description: Output only. The last update timestamp. Currently never set.
                    format: date-time
            description: UserWebhook is a webhook owned by a user.
        VideoMetadata:
            type: object
            properties:
                durationSeconds:
                    type: number
                    description: The duration of the video in seconds.
                    format: double
            description: VideoMetadata is metadata recorded by the source of a video.
tags:
    - name: AIService
      description: AIService runs AI tasks through the AI providers configured on the instance.
    - name: AttachmentService
      description: AttachmentService manages files attached to notes.
    - name: AuthService
      description: 'AuthService manages sign-in sessions: it issues, refreshes, and revokes the tokens that authenticate API calls.'
    - name: IdentityProviderService
      description: IdentityProviderService manages the external identity providers users can sign in with.
    - name: InstanceService
      description: InstanceService exposes the instance profile, instance-wide settings and usage statistics.
    - name: NoteService
      description: |-
        NoteService manages notes and their attachments, relations, comments,
         reactions, and share links.
    - name: RosterService
      description: RosterService manages which member is on duty on which day.
    - name: SpaceService
      description: SpaceService manages collaborative spaces, their members and their invitations.
    - name: UserService
      description: |-
        UserService manages users and the resources they own: settings, statistics,
         note views, notifications, webhooks, linked identities, personal access
         tokens, and note export files.
