                defaultStorageId:
                    type: string
                    description: The ID of the storage used for new attachments.
                filepathTemplate:
                    type: string
                    description: |-
                        The template of attachment file paths.
                         Default is assets/{timestamp}_{uuid}_{filename}.
                storageType:
                    enum:
                        - STORAGE_TYPE_UNSPECIFIED
                        - DATABASE
                        - LOCAL
                        - S3
                    type: string
                    description: Legacy compatibility field. New clients use default_storage_id.
