                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        IdentityProvider:
            required:
                - type
                - title
                - config
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the identity provider.
                         Format: identity-providers/{idp}
                type:
                    enum:
                        - TYPE_UNSPECIFIED
                        - OAUTH2
                    type: string
                    description: Required. The type of the identity provider.
                    format: enum
                title:
                    type: string
                    description: Required. The display title of the identity provider.
                identifierFilter:
                    type: string
                    description: Optional. A regular expression the user identifier must match to sign in. Empty allows every identifier.
                config:
                    allOf:
                        - $ref: '#/components/schemas/IdentityProviderConfig'
                    description: Required. The type-specific configuration of the identity provider.
            description: IdentityProvider is an external identity provider users can sign in with.
        IdentityProviderConfig:
            type: object
            properties:
                oauth2Config:
                    allOf:
                        - $ref: '#/components/schemas/OAuth2Config'
                    description: The configuration of an OAuth2 identity provider.
            description: IdentityProviderConfig is the type-specific configuration of an identity provider.
        ImportNotesIssue:
            type: object
            properties:
                noteUid:
                    type: string
                    description: The archive note UID the issue concerns, if any.
                message:
                    type: string
                    description: A description of the issue.
            description: |-
                ImportNotesIssue is one warning or failure of an import, tied to the note
                 UID from the archive when there is one.
        ImportNotesPlan:
            type: object
            properties:
                exportTime:
                    type: string
                    description: When the archive was written.
                    format: date-time
                exporter:
                    type: string
                    description: Username of the user who exported the archive.
                generator:
                    type: string
                    description: The software that wrote the archive.
                noteCount:
                    type: integer
                    description: Number of note records in the archive.
                    format: int32
                attachmentCount:
                    type: integer
                    description: Number of attachment files in the archive.
                    format: int32
                new:
                    type: integer
                    description: Notes whose UID nobody on the instance holds.
                    format: int32
                existing:
                    type: integer
                    description: Notes the user already holds; the conflict policy applies to them.
                    format: int32
                renamed:
                    type: integer
                    description: Notes whose UID another account holds; they are imported under fresh UIDs.
                    format: int32
                warnings:
                    type: array
                    items:
                        $ref: '#/components/schemas/ImportNotesIssue'
                    description: Deviations the archive reader corrected while validating.
            description: ImportNotesPlan describes what importing a staged archive would do.
        ImportNotesReport:
            type: object
            properties:
                created:
                    type: integer
                    description: Number of notes created.
                    format: int32
                updated:
                    type: integer
                    description: Number of existing notes replaced under the REPLACE policy.
                    format: int32
                skipped:
                    type: integer
                    description: Number of existing notes left untouched under the SKIP policy.
                    format: int32
                failed:
                    type: integer
                    description: Number of notes that could not be imported.
                    format: int32
                warnings:
                    type: array
                    items:
                        $ref: '#/components/schemas/ImportNotesIssue'
                    description: Deviations the importer corrected or tolerated.
                failures:
                    type: array
                    items:
                        $ref: '#/components/schemas/ImportNotesIssue'
                    description: One entry per failed note, with the reason.
            description: ImportNotesReport is the outcome of an import.
        ImportNotesRequest:
            required:
                - name
                - writeOffset
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Required. The user who receives the notes. Must be the caller.
                         Format: users/{user}
                spec:
                    allOf:
                        - $ref: '#/components/schemas/ImportNotesSpec'
                    description: Starts a new upload. The same call may also carry data and finish_write.
                uploadId:
                    type: string
                    description: Continues the upload identified by a previous response.
                writeOffset:
                    type: string
                    description: |-
                        Required. Zero-based byte offset at which data is written. Must equal the
                         committed size, except when retrying the most recently accepted chunk
                         with identical bytes and offset, which is accepted without writing again.
                data:
                    type: string
                    description: |-
                        Optional. Archive bytes, at most max_chunk_size long. With no data and
                         finish_write false, the call reports progress without writing, and
                         write_offset is ignored.
                    format: bytes
                finishWrite:
                    type: boolean
                    description: |-
                        Optional. Finish the upload after writing data. The committed size must
                         then equal total_size. The archive is validated and, unless
                         validate_only is set, imported. Any later call for an imported upload
                         returns the same report.
                conflictPolicy:
                    enum:
                        - CONFLICT_POLICY_UNSPECIFIED
                        - SKIP
                        - REPLACE
                        - DUPLICATE
                    type: string
                    description: Optional. Read on the finishing call that imports. Unspecified means SKIP.
                    format: enum
                validateOnly:
                    type: boolean
                    description: |-
                        Optional. On a finishing call, validate the archive and return the plan
                         without importing. The upload stays staged so a later finishing call can
                         import it.
            description: Request message for UserService.ImportNotes.
        ImportNotesResponse:
            type: object
            properties:
                uploadId:
                    type: string
                    description: Opaque ID for subsequent calls. This is not a resource name.
                committedSize:
                    type: string
                    description: Number of archive bytes committed so far.
                maxChunkSize:
                    type: integer
                    description: Maximum number of data bytes accepted in one call.
                    format: int32
                plan:
                    allOf:
                        - $ref: '#/components/schemas/ImportNotesPlan'
                    description: What the import would do. Set by a finishing call with validate_only.
                report:
                    allOf:
                        - $ref: '#/components/schemas/ImportNotesReport'
                    description: What the import did. Set by a finishing call that imported.
            description: Response message for UserService.ImportNotes.
        ImportNotesSpec:
            type: object
            properties:
                totalSize:
                    type: string
                    description: Optional. Total size of the archive in bytes.
            description: ImportNotesSpec describes a new note import upload.
        InstanceProfile:
            type: object
            properties:
                version:
                    type: string
                    description: The version of the running server.
                commit:
                    type: string
                    description: The build commit of the running server.
                demo:
                    type: boolean
                    description: Whether the instance runs in demo mode.
                instanceUrl:
                    type: string
                    description: The configured URL of the instance.
                accessMode:
                    enum:
                        - INSTANCE_ACCESS_MODE_UNSPECIFIED
                        - INSTANCE_ACCESS_MODE_PRIVATE
                        - INSTANCE_ACCESS_MODE_PUBLIC
                    type: string
                    description: Whether unauthenticated users may access instance content.
                    format: enum
                needsSetup:
                    type: boolean
                    description: |-
                        Whether the instance has no users yet and requires initial setup (creating the first admin account).
                         Unlike a null admin, this stays false once any user exists, so an instance that has lost its admins is not
                         mistaken for a fresh install.
                admin:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: |-
                        The first administrator of the instance, for display purposes.
                         May be null on an instance that has lost all admins; use needs_setup to determine whether initial setup is
                         required.
                challenge:
                    allOf:
                        - $ref: '#/components/schemas/InstanceProfile_Challenge'
                    description: |-
                        The proof-of-humanity challenge required on signup and password sign-in.
                         Absent when none is configured, which is the case on every self-hosted instance.
            description: InstanceProfile is the basic information about the instance.
        InstanceProfile_Challenge:
            type: object
            properties:
                provider:
                    type: string
                    description: The challenge provider, which selects the widget the web app renders.
                siteKey:
                    type: string
                    description: The provider's public site key for the widget.
            description: Challenge describes a proof-of-humanity challenge widget.
        InstanceSetting:
            type: object
