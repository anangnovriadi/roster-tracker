                name:
                    type: string
                    description: |-
                        Identifier. The resource name of the instance setting. {setting} is a Key value, such as GENERAL.
                         Format: instance/settings/{setting}
                generalSetting:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_GeneralSetting'
                    description: The value of the GENERAL setting.
                storageSetting:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_StorageSetting'
                    description: The value of the STORAGE setting.
                noteRelatedSetting:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_NoteRelatedSetting'
                    description: The value of the NOTE_RELATED setting.
                tagsSetting:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_TagsSetting'
                    description: The value of the TAGS setting.
                notificationSetting:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_NotificationSetting'
                    description: The value of the NOTIFICATION setting.
                aiSetting:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_AISetting'
                    description: The value of the AI setting.
                accessSetting:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_AccessSetting'
                    description: The value of the ACCESS setting.
            description: InstanceSetting is one group of instance-wide settings, selected by its key.
        InstanceSetting_AIProviderConfig:
            type: object
            properties:
                id:
                    type: string
                    description: The provider ID. Generated when empty on update.
                title:
                    type: string
                    description: The provider display title.
                type:
                    enum:
                        - AI_PROVIDER_TYPE_UNSPECIFIED
                        - OPENAI
                        - GEMINI
                    type: string
                    description: The provider implementation type.
                    format: enum
                endpoint:
                    type: string
                    description: The provider API endpoint. Defaults to the provider's public endpoint when empty.
                apiKey:
                    writeOnly: true
                    type: string
                    description: Input only. The provider API key. Never returned; an empty value keeps the stored key.
                apiKeySet:
                    readOnly: true
                    type: boolean
                    description: Output only. Whether an API key is stored for this provider.
                apiKeyHint:
                    readOnly: true
                    type: string
                    description: Output only. A masked hint of the stored API key.
            description: AIProviderConfig is one callable AI provider connection.
        InstanceSetting_AISetting:
            type: object
            properties:
                providers:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceSetting_AIProviderConfig'
                    description: The AI provider configurations available instance-wide.
                transcription:
                    allOf:
                        - $ref: '#/components/schemas/InstanceSetting_TranscriptionConfig'
                    description: |-
                        The speech-to-text feature configuration.
                         When unset or transcription.provider_id is empty, transcription is disabled. An update that omits it keeps the
                         stored configuration.
            description: AISetting is the AI provider configuration.
        InstanceSetting_AccessSetting:
            type: object
            properties:
                accessMode:
                    enum:
                        - INSTANCE_ACCESS_MODE_UNSPECIFIED
                        - INSTANCE_ACCESS_MODE_PRIVATE
                        - INSTANCE_ACCESS_MODE_PUBLIC
                    type: string
                    description: Whether unauthenticated users may access instance content. Must be PRIVATE or PUBLIC on update.
                    format: enum
            description: AccessSetting is the instance access policy.
        InstanceSetting_GeneralSetting:
            type: object
            properties:
                customProfile:
                    allOf:
                        - $ref: '#/components/schemas/GeneralSetting_CustomProfile'
                    description: Branding shown in the web app.
                disallowUserRegistration:
                    type: boolean
                    description: Whether user self-registration is disabled.
                disallowPasswordAuth:
                    type: boolean
                    description: Whether password authentication is disabled.
                disallowChangeUsername:
                    type: boolean
                    description: Whether users are prevented from changing their username.
                disallowChangeNickname:
                    type: boolean
                    description: Whether users are prevented from changing their nickname.
                weekStartDayOffset:
                    type: integer
                    description: |-
                        The first day of the week as an offset from Sunday.
                         0: Sunday, 1: Monday, 2: Tuesday, 3: Wednesday, 4: Thursday, 5: Friday, 6: Saturday.
                         Default is Sunday.
                    format: int32
                additionalStyle:
                    type: string
                    description: Custom CSS injected into the web app.
                additionalScript:
                    type: string
                    description: Custom JavaScript injected into the web app.
            description: GeneralSetting is the general instance configuration.
        InstanceSetting_NoteRelatedSetting:
            type: object
