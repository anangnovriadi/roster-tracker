syntax = "proto3";

package roster.api;

import "api/attachment_service.proto";
import "api/common.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api";

// NoteService manages notes and their attachments, relations, comments,
// reactions, and share links.
service NoteService {
  // ListNotes lists the notes the caller can read, excluding comments.
  // Anonymous callers can list only when the instance allows public access.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {
    option (google.api.http) = {get: "/api/notes"};
    option (google.api.method_signature) = "";
  }

  // GetNote gets a note. Requires read access to the note.
  rpc GetNote(GetNoteRequest) returns (Note) {
    option (google.api.http) = {get: "/api/{name=notes/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreateNote creates a note owned by the authenticated user. The request body
  // is a Note; set its Markdown content and visibility (defaults to PRIVATE).
  // Requires authentication.
  rpc CreateNote(CreateNoteRequest) returns (Note) {
    option (google.api.http) = {
      post: "/api/notes"
      body: "note"
    };
    option (google.api.method_signature) = "note";
  }

  // UpdateNote updates the note fields listed in update_mask. Requires the note
  // creator or an instance administrator.
  rpc UpdateNote(UpdateNoteRequest) returns (Note) {
    option (google.api.http) = {
      patch: "/api/{note.name=notes/*}"
      body: "note"
    };
    option (google.api.method_signature) = "note,update_mask";
  }

  // DeleteNote deletes the named note and its comment subtree, including nested
  // replies and their owned resources. It removes incident relations for all
  // deleted notes. Requires the note creator or an instance administrator.
  rpc DeleteNote(DeleteNoteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/{name=notes/*}"};
    option (google.api.method_signature) = "name";
  }

  // ListNoteAttachments lists the attachments of a note. Requires read access
  // to the note.
  rpc ListNoteAttachments(ListNoteAttachmentsRequest) returns (ListNoteAttachmentsResponse) {
    option (google.api.http) = {get: "/api/{parent=notes/*}/attachments"};
    option (google.api.method_signature) = "parent";
  }

  // SetNoteAttachments replaces the full set of attachments on a note with the
  // provided list (not an append). Pass the complete desired set; an empty list
  // clears all attachments. Idempotent. Requires the note creator or an
  // instance administrator.
  rpc SetNoteAttachments(SetNoteAttachmentsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/{name=notes/*}/attachments"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // ListNoteRelations lists the relations of a note in both directions.
  // Requires read access to the note.
  rpc ListNoteRelations(ListNoteRelationsRequest) returns (ListNoteRelationsResponse) {
    option (google.api.http) = {get: "/api/{parent=notes/*}/relations"};
    option (google.api.method_signature) = "parent";
  }

  // SetNoteRelations replaces the full set of mutable REFERENCE relations on a
  // note. COMMENT relations are immutable creation context and are rejected by
  // this RPC. An empty list clears references without changing COMMENT.
  // Requires the note creator or an instance administrator.
  rpc SetNoteRelations(SetNoteRelationsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/{name=notes/*}/relations"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // ListNoteComments lists the active comments on a note that the caller can
  // read. Requires read access to the note.
  rpc ListNoteComments(ListNoteCommentsRequest) returns (ListNoteCommentsResponse) {
    option (google.api.http) = {get: "/api/{parent=notes/*}/comments"};
    option (google.api.method_signature) = "parent";
  }

  // CreateNoteComment atomically creates an independent note plus one immutable
  // COMMENT context relation to the named note. The new note keeps its own
  // placement, visibility, authorship, and lifecycle. The named note must be
  // readable by the caller and not archived.
  rpc CreateNoteComment(CreateNoteCommentRequest) returns (Note) {
    option (google.api.http) = {
      post: "/api/{parent=notes/*}/comments"
      body: "comment"
    };
    option (google.api.method_signature) = "parent,comment";
  }

  // ListNoteReactions lists the reactions on a note. Requires read access to
  // the note.
  rpc ListNoteReactions(ListNoteReactionsRequest) returns (ListNoteReactionsResponse) {
    option (google.api.http) = {get: "/api/{parent=notes/*}/reactions"};
    option (google.api.method_signature) = "parent";
  }

  // DeleteNoteReaction deletes a reaction. Requires the reaction creator or an
  // instance administrator.
  rpc DeleteNoteReaction(DeleteNoteReactionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/{name=notes/*/reactions/*}"};
    option (google.api.method_signature) = "name";
  }

  // UpsertNoteReaction adds or updates the authenticated user's reaction on a
  // note. Requires read access to the note.
  rpc UpsertNoteReaction(UpsertNoteReactionRequest) returns (Reaction) {
    option (google.api.http) = {
      post: "/api/{parent=notes/*}/reactions"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }

  // ListNoteShares lists all share links for a note. Requires the note creator
  // or an instance administrator.
  rpc ListNoteShares(ListNoteSharesRequest) returns (ListNoteSharesResponse) {
    option (google.api.http) = {get: "/api/{parent=notes/*}/shares"};
    option (google.api.method_signature) = "parent";
  }

  // CreateNoteShare creates a share link for a note. Requires the note creator
  // or an instance administrator. Only active notes without SPACE visibility
  // can be shared.
  rpc CreateNoteShare(CreateNoteShareRequest) returns (NoteShare) {
    option (google.api.http) = {
      post: "/api/{parent=notes/*}/shares"
      body: "note_share"
    };
    option (google.api.method_signature) = "parent,note_share";
  }

  // DeleteNoteShare revokes a share link. Requires the note creator or an
  // instance administrator.
  rpc DeleteNoteShare(DeleteNoteShareRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/{name=notes/*/shares/*}"};
    option (google.api.method_signature) = "name";
  }

  // GetSharedNote resolves a share token to its note. No authentication is
  // required. Returns NOT_FOUND if the token is invalid or expired.
  rpc GetSharedNote(GetSharedNoteRequest) returns (Note) {
    option (google.api.http) = {get: "/api/shares/{share_token}/note"};
  }

  // GetLinkMetadata fetches the title, description, and image of a link.
  rpc GetLinkMetadata(GetLinkMetadataRequest) returns (LinkMetadata) {
    option (google.api.http) = {get: "/api/notes/-/linkMetadata"};
  }

  // BatchGetLinkMetadata fetches the metadata of up to 10 links.
  rpc BatchGetLinkMetadata(BatchGetLinkMetadataRequest) returns (BatchGetLinkMetadataResponse) {
    option (google.api.http) = {
      post: "/api/notes/-/linkMetadata:batchGet"
      body: "*"
    };
  }
}

// Visibility controls who can read a note.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  // Only the creator can read the note.
  PRIVATE = 1;
  // Signed-in users of the instance can read the note.
  PROTECTED = 2;
  // Signed-in users can read the note; anonymous visitors can read it when
  // instance policy permits.
  PUBLIC = 3;
  // Active members of the note's space can read the note.
  SPACE = 4;
}

// Note is a Markdown note written by a user.
message Note {
  option (google.api.resource) = {
    type: "roster.api/Note"
    pattern: "notes/{note}"
    singular: "note"
    plural: "notes"
  };

  // Identifier. The resource name of the note, where note is the
  // user-defined UID.
  // Format: notes/{note}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The resource name of the creator.
  // Format: users/{user}
  string creator = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "roster.api/User"}
  ];

  // Optional. The space in which the note is placed. Every note, including a
  // comment, owns its placement independently.
  // Format: spaces/{space}
  optional string space = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "roster.api/Space"}
  ];

  // Required. The content of the note in Markdown. Must not exceed the
  // instance's content length limit.
  string content = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The location of the note.
  optional Location location = 5 [(google.api.field_behavior) = OPTIONAL];

  // Required. The visibility of the note. Defaults to PRIVATE on creation when
  // unspecified. SPACE requires the note to be placed in a space.
  Visibility visibility = 6 [(google.api.field_behavior) = REQUIRED];

  // Required. The state of the note. New notes are always NORMAL; change it
  // with UpdateNote.
  State state = 7 [(google.api.field_behavior) = REQUIRED];

  // Optional. Whether the note is pinned. Ignored on creation; change it with
  // UpdateNote.
  bool pinned = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The attachments of the note. Setting it replaces the full set.
  repeated Attachment attachments = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The relations of the note in both directions. Only REFERENCE
  // relations can be set; COMMENT relations are output only.
  repeated NoteRelation relations = 10 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The reactions to the note.
  repeated Reaction reactions = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The context note of this COMMENT relation, if any.
  // Its identity is returned even when the caller cannot read the parent.
  // Fetch the parent independently; this field does not grant read access.
  // Format: notes/{note}
  optional string parent = 12 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Output only. The tags extracted from the content.
  repeated string tags = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The properties computed from the content.
  Property property = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A plain-text snippet of the content.
  string snippet = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The creation time. Defaults to the current time when unset on
  // creation.
  google.protobuf.Timestamp create_time = 16 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The last update time. Defaults to the current time when unset on
  // creation.
  google.protobuf.Timestamp update_time = 17 [(google.api.field_behavior) = OPTIONAL];

  // Property holds properties computed from the note content.
  message Property {
    // The text of the H1 heading when it is the first block of the content.
    string title = 1;

    // Whether the content contains a link.
    bool has_link = 2;

    // Whether the content contains inline code or a code block.
    bool has_code = 3;

    // Whether the content contains a task list.
    bool has_task_list = 4;

    // Whether the content contains an unchecked task.
    bool has_incomplete_tasks = 5;
  }
}

// Request message for NoteService.ListNotes.
message ListNotesRequest {
  // Optional. The maximum number of notes to return. The service may return
  // fewer. Defaults to 50; values above 1000 are coerced to 1000.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token from a previous call. Provide it to retrieve the
  // next page.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A CEL expression to filter notes. Combine terms with && and ||.
  // Available fields:
  //   content (string), creator (string, e.g. "users/1"),
  //   created_ts / updated_ts (timestamp), pinned (bool),
  //   visibility (string: PRIVATE | PROTECTED | PUBLIC | SPACE),
  //   space (string resource name, or null when the note has no space;
  //     supports == and comparisons against null, e.g. space != null),
  //   tags (list<string>; match with `"work" in tags`, not `tag == "work"`),
  //   has_task_list / has_link / has_code / has_incomplete_tasks (bool),
  //   has_location (bool; true when the note has a location attached).
  // Note: the time fields here are created_ts / updated_ts, which differ from
  // the create_time / update_time names used by order_by.
  // Examples:
  //   pinned == true && visibility == "PUBLIC"
  //   space == "spaces/team" or space == null
  //   tags.exists(t, t == "urgent")
  //   content.contains("roadmap") && created_ts > now - duration("168h")
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The order to sort results by, as a comma-separated list of
  // fields following AIP-132. Defaults to "create_time desc".
  // Supported fields: pinned, create_time, update_time, name.
  // Example: "pinned desc, create_time desc" or "update_time asc".
  // Note: order_by uses create_time / update_time, while the filter
  // expression uses created_ts / updated_ts for the same timestamps.
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether to include deleted notes. Currently ignored by the
  // server.
  bool show_deleted = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The state of the notes to list. Defaults to NORMAL. Set to
  // ARCHIVED to list the caller's own archived notes.
  State state = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for NoteService.ListNotes.
message ListNotesResponse {
  // The notes.
  repeated Note notes = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// Request message for NoteService.GetNote.
message GetNoteRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];
}

// Request message for NoteService.CreateNote.
message CreateNoteRequest {
  // Required. The note to create.
  Note note = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The ID to use for the note, which becomes the final segment of
  // its resource name. If empty, a unique ID is generated.
  // Format: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,34}[a-zA-Z0-9])?$
  string note_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for NoteService.UpdateNote.
message UpdateNoteRequest {
  // Required. The note to update. Its name identifies the note.
  Note note = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The fields to update. Supported paths: content, visibility,
  // space, pinned, state, create_time, update_time, location, attachments,
  // relations.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for NoteService.DeleteNote.
message DeleteNoteRequest {
  // Required. The resource name of the note to delete.
  // Format: notes/{note}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Optional. Currently ignored by the server; deletion always includes the
  // comment subtree.
  bool force = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Location is a geographic location attached to a note.
message Location {
  // Optional. A human-readable label for the location.
  string placeholder = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The latitude of the location.
  double latitude = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The longitude of the location.
  double longitude = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for NoteService.ListNoteAttachments.
message ListNoteAttachmentsRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Optional. The maximum number of attachments to return. The service may
  // return fewer. Currently ignored; all attachments are returned.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token from a previous call. Provide it to retrieve the
  // next page. Currently ignored.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for NoteService.ListNoteAttachments.
message ListNoteAttachmentsResponse {
  // The attachments.
  repeated Attachment attachments = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// Request message for NoteService.SetNoteAttachments.
message SetNoteAttachmentsRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Required. The complete set of attachments for the note.
  repeated Attachment attachments = 2 [(google.api.field_behavior) = REQUIRED];
}

// NoteRelation is a directed link from one note to another.
message NoteRelation {
  // Required. The source note of the relation. For COMMENT, the comment.
  NoteRef note = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The target note of the relation. For COMMENT, the note being
  // commented on.
  NoteRef related_note = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The type of the relation.
  Type type = 3 [(google.api.field_behavior) = REQUIRED];

  // Type is the kind of a note relation.
  enum Type {
    TYPE_UNSPECIFIED = 0;
    // The source note references the target note. Clients can set it.
    REFERENCE = 1;
    // The source note is a comment on the target note. Output only.
    COMMENT = 2;
  }

  // NoteRef identifies a note in a relation.
  message NoteRef {
    // Required. The resource name of the note.
    // Format: notes/{note}
    string name = 1 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.resource_reference) = {type: "roster.api/Note"}
    ];

    // Output only. A plain-text snippet of the note content. Empty in
    // ListNotes and ListNoteComments responses.
    string snippet = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  }
}

// Request message for NoteService.ListNoteRelations.
message ListNoteRelationsRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Optional. The maximum number of relations to return. The service may
  // return fewer. Defaults to 50; values above 1000 are coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token from a previous call. Provide it to retrieve the
  // next page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for NoteService.ListNoteRelations.
message ListNoteRelationsResponse {
  // The relations.
  repeated NoteRelation relations = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// Request message for NoteService.SetNoteRelations.
message SetNoteRelationsRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Required. The complete set of REFERENCE relations for the note. COMMENT
  // relations are rejected.
  repeated NoteRelation relations = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for NoteService.ListNoteComments.
message ListNoteCommentsRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Optional. The maximum number of comments to return. The service may return
  // fewer. Defaults to 50; values above 1000 are coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token from a previous call. Provide it to retrieve the
  // next page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The order to sort results by. Currently ignored by the server.
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for NoteService.ListNoteComments.
message ListNoteCommentsResponse {
  // The comment notes.
  repeated Note comments = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// Request message for NoteService.CreateNoteComment.
message CreateNoteCommentRequest {
  // Required. The resource name of the note to comment on.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Required. The comment note to create.
  Note comment = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. The ID to use for the comment note, in the same format as
  // CreateNoteRequest.note_id. If empty, a unique ID is generated.
  string comment_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Reaction is a reaction a user leaves on a note.
message Reaction {
  option (google.api.resource) = {
    type: "roster.api/Reaction"
    pattern: "notes/{note}/reactions/{reaction}"
    singular: "reaction"
    plural: "reactions"
  };

  // Identifier. The resource name of the reaction.
  // Format: notes/{note}/reactions/{reaction}
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // Output only. The resource name of the creator.
  // Format: users/{user}
  string creator = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "roster.api/User"}
  ];

  // Required. The reaction, such as an emoji ("👍", "❤️", "😄").
  string reaction_type = 3 [(google.api.field_behavior) = REQUIRED];

  // Output only. The creation time.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for NoteService.ListNoteReactions.
message ListNoteReactionsRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Optional. The maximum number of reactions to return. The service may
  // return fewer. Currently ignored; all reactions are returned.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token from a previous call. Provide it to retrieve the
  // next page. Currently ignored.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for NoteService.ListNoteReactions.
message ListNoteReactionsResponse {
  // The reactions.
  repeated Reaction reactions = 1;

  // A token to retrieve the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// Request message for NoteService.DeleteNoteReaction.
message DeleteNoteReactionRequest {
  // Required. The resource name of the reaction to delete.
  // Format: notes/{note}/reactions/{reaction}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Reaction"}
  ];
}

// Request message for NoteService.UpsertNoteReaction.
message UpsertNoteReactionRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Required. The reaction to upsert. Only reaction_type is used.
  Reaction reaction = 2 [(google.api.field_behavior) = REQUIRED];
}

// NoteShare is an access grant that permits read-only access to a note via an
// opaque bearer token.
message NoteShare {
  option (google.api.resource) = {
    type: "roster.api/NoteShare"
    pattern: "notes/{note}/shares/{share}"
    singular: "noteShare"
    plural: "noteShares"
  };

  // Identifier. The resource name of the share. The {share} segment is the
  // opaque token used in the share URL.
  // Format: notes/{note}/shares/{share}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The creation time.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The time after which the share link stops working. Must be in
  // the future when set. If unset, the link never expires.
  optional google.protobuf.Timestamp expire_time = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for NoteService.ListNoteShares.
message ListNoteSharesRequest {
  // Required. The resource name of the note.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];
}

// Response message for NoteService.ListNoteShares.
message ListNoteSharesResponse {
  // The share links.
  repeated NoteShare note_shares = 1;
}

// Request message for NoteService.CreateNoteShare.
message CreateNoteShareRequest {
  // Required. The resource name of the note to share.
  // Format: notes/{note}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/Note"}
  ];

  // Required. The share to create. Only expire_time is used.
  NoteShare note_share = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for NoteService.DeleteNoteShare.
message DeleteNoteShareRequest {
  // Required. The resource name of the share to delete.
  // Format: notes/{note}/shares/{share}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "roster.api/NoteShare"}
  ];
}

// Request message for NoteService.GetSharedNote.
message GetSharedNoteRequest {
  // Required. The opaque bearer token from the share URL.
  string share_token = 1 [(google.api.field_behavior) = REQUIRED];
}

// LinkMetadata is the preview metadata of a web link.
message LinkMetadata {
  // The link URL as given in the request.
  string url = 1;

  // The page title.
  string title = 2;

  // The page description.
  string description = 3;

  // The preview image URL.
  string image = 4;
}

// Request message for NoteService.GetLinkMetadata.
message GetLinkMetadataRequest {
  // Required. The link URL.
  string url = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for NoteService.BatchGetLinkMetadata.
message BatchGetLinkMetadataRequest {
  // Required. The link URLs. At most 10.
  repeated string urls = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for NoteService.BatchGetLinkMetadata.
message BatchGetLinkMetadataResponse {
  // The link metadata, in the same order as the requested URLs.
  repeated LinkMetadata link_metadata = 1;
}
