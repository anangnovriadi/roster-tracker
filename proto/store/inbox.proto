syntax = "proto3";

package roster.store;

option go_package = "gen/store";

message InboxMessage {
  message NoteCommentPayload {
    int32 note_id = 1;
    int32 related_note_id = 2;
  }

  message NoteMentionPayload {
    int32 note_id = 1;
    int32 related_note_id = 2;
  }

  message SpaceInvitationPayload {
    // The space the receiver was invited to join. The offered role and the
    // invitation state are resolved from the space membership at read time.
    int32 space_id = 1;
  }

  // The type of the inbox message.
  Type type = 1;
  oneof payload {
    NoteCommentPayload note_comment = 2;
    NoteMentionPayload note_mention = 3;
    SpaceInvitationPayload space_invitation = 4;
  }

  enum Type {
    TYPE_UNSPECIFIED = 0;
    // Note comment notification.
    NOTE_COMMENT = 1;
    // Note mention notification.
    NOTE_MENTION = 2;
    // Space invitation notification.
    SPACE_INVITATION = 3;
  }
}
